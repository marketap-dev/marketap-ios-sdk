name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Xcode 버전
        run: xcodebuild -version

      - name: 시뮬레이터 선택
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[]
                      | select(.key | test("iOS"))
                      | .value[]
                      | select(.isAvailable and (.name | test("iPhone")))]
                     | last | .udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "사용 가능한 iPhone 시뮬레이터가 없다" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"

      - name: 테스트
        run: |
          set -euo pipefail
          run_tests() {
            xcodebuild test \
              -scheme MarketapSDK-Package \
              -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
              -resultBundlePath TestResults.xcresult
          }
          if command -v xcbeautify >/dev/null 2>&1; then
            run_tests | xcbeautify
          else
            run_tests
          fi

      - name: 실패 시 결과 번들 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: TestResults.xcresult
          retention-days: 7
